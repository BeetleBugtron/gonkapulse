                  Tokens · 24h
                </div>
                <div
                  class="value"
                  id="tokens"
                >
                  —
                </div>
              </div>

              <div class="card">
                <div class="eyebrow">
                  Monitoring cost · 24h
                </div>
                <div
                  class="value money"
                  id="cost"
                >
                  —
                </div>
              </div>

            </div>

          </section>


          <section class="section">

          <h2>Gonka economics</h2>

          <div class="grid">

            <div class="card">
              <div class="eyebrow">
                Price / 1M tokens
              </div>
              <div
                class="value money"
                id="price"
              >
                —
              </div>
            </div>

            <div class="card">
              <div class="eyebrow">
                120K-token agent turn
              </div>
              <div
                class="value money"
                id="agent"
              >
                —
              </div>
            </div>

            <div class="card">
              <div class="eyebrow">
                10K heavy turns
              </div>
              <div
                class="value money"
                id="turn10k"
              >
                —
              </div>
            </div>

            <div class="card">
              <div class="eyebrow">
                Projected monitoring · 30d
              </div>
              <div
                class="value money"
                id="monthly"
              >
                —
              </div>
            </div>

          </div>

          </section>


          <section class="section">

            <h2>Token usage · 24h</h2>

            <div class="grid">

              <div class="card">
                <div class="eyebrow">
                  Prompt
                </div>
                <div
                  class="value"
                  id="promptTokens"
                >
                  —
                </div>
              </div>

              <div class="card">
                <div class="eyebrow">
                  Completion
                </div>
                <div
                  class="value"
                  id="completionTokens"
                >
                  —
                </div>
              </div>

              <div class="card">
                <div class="eyebrow">
                  Reasoning
                </div>
                <div
                  class="value"
                  id="reasoningTokens"
                >
                  —
                </div>
              </div>

              <div class="card">
                <div class="eyebrow">
                  Total
                </div>
                <div
                  class="value"
                  id="totalTokens"
                >
                  —
                </div>
              </div>

            </div>

          </section>


          <section class="section">

            <h2>Recent observations</h2>

            <div
              class="bars"
              id="timeline"
            ></div>

          </section>


          <details>

            <summary>
              Every retained measurement
            </summary>

            <div class="body">

              <table>

                <thead>
                  <tr>
                    <th>Time</th>
                    <th>Status</th>
                    <th>HTTP</th>
                    <th>Latency</th>
                    <th>TTFB</th>
                    <th>Prompt</th>
                    <th>Completion</th>
                    <th>Reasoning</th>
                    <th>Total</th>
                    <th>Cost</th>
                  </tr>
                </thead>

                <tbody id="history"></tbody>

              </table>

            </div>

          </details>

          <footer id="footer"></footer>

          </main>


          <script>

          const e = x =>
            String(x ?? "—")
              .replaceAll("&","&amp;")
              .replaceAll("<","&lt;")
              .replaceAll(">","&gt;");

          const n = x =>
            x == null
              ? "—"
              : Number(x).toLocaleString(
                  undefined,
                  {maximumFractionDigits:3}
                );

          const usd = x =>
            x == null
              ? "—"
              : "$" + Number(x).toLocaleString(
                  undefined,
                  {
                    minimumFractionDigits:
                      Number(x) < 0.01 ? 6 : 2,

                    maximumFractionDigits:
                      Number(x) < 0.01 ? 8 : 2
                  }
                );


          async function load(){

            const t = Date.now();

            const [s,m] = await Promise.all([

              fetch(
                `data/summary.json?${t}`
              ).then(r => r.json()),

              fetch(
                `data/measurements.json?${t}`
              ).then(r => r.json())

            ]);


            const current = s.current || {};
            const d = s.last_24h || {};
            const pricing = s.pricing || {};
            const agent = pricing.heavy_agent || {};
            const monitoring = s.monitoring_cost || {};


            const status =
              document.querySelector("#status");

            status.textContent =
              String(
                current.status || "unknown"
              ).toUpperCase();

            status.className =
              `status ${e(current.status)}`;


            document.querySelector(
              "#p95"
            ).textContent =
              d.p95_latency_ms == null
                ? "—"
                : n(d.p95_latency_ms) + " ms";


            document.querySelector(
              "#success"
            ).textContent =
              d.success_pct == null
                ? "—"
                : n(d.success_pct) + "%";


            document.querySelector(
              "#tokens"
            ).textContent =
              n(d.total_tokens);


            document.querySelector(
              "#cost"
            ).textContent =
              usd(d.cost_usd);


            document.querySelector(
              "#price"
            ).textContent =
              usd(
                pricing.usd_per_million_tokens
              );


            document.querySelector(
              "#agent"
            ).textContent =
              usd(agent.cost_usd);


            document.querySelector(
              "#turn10k"
            ).textContent =
              usd(agent.cost_10k_turns_usd);


            document.querySelector(
              "#monthly"
            ).textContent =
              usd(
                monitoring.projected_30d_usd
              );


            document.querySelector(
              "#promptTokens"
            ).textContent =
              n(d.prompt_tokens);


            document.querySelector(
              "#completionTokens"
            ).textContent =
              n(d.completion_tokens);


            document.querySelector(
              "#reasoningTokens"
            ).textContent =
              n(d.reasoning_tokens);


            document.querySelector(
              "#totalTokens"
            ).textContent =
              n(d.total_tokens);


            const rows =
              m.measurements || [];


            const recent =
              rows.slice(-288);


            document.querySelector(
              "#timeline"
            ).innerHTML =
              recent.map(
                r =>
                  `<i
                    class="bar ${e(r.status)}"
                    title="${e(r.ts)} · ${e(r.status)} · ${n(r.latency_ms)} ms"
                  ></i>`
              ).join("");


            document.querySelector(
              "#history"
            ).innerHTML =
              rows
                .slice()
                .reverse()
                .map(
                  r => `
                    <tr>

                      <td>${e(r.ts)}</td>

                      <td class="${e(r.status)}">
                        ${e(r.status)}
                      </td>

                      <td>${e(r.http)}</td>

                      <td>
                        ${n(r.latency_ms)} ms
                      </td>

                      <td>
                        ${n(r.ttfb_ms)} ms
                      </td>

                      <td>
                        ${n(r.prompt_tokens)}
                      </td>

                      <td>
                        ${n(r.completion_tokens)}
                      </td>

                      <td>
                        ${n(r.reasoning_tokens)}
                      </td>

                      <td>
                        ${n(r.total_tokens)}
                      </td>

                      <td class="money">
                        ${usd(r.cost_usd)}
                      </td>

                    </tr>
                  `
                ).join("");


            document.querySelector(
              "#footer"
            ).textContent =
              "Updated "
              + new Date(
                  s.generated_at
                ).toLocaleString()
              + " · zai-org/GLM-5.3-Flash · "
              + "$0.0023 / 1M tokens";

          }


          load();

          setInterval(
            load,
            60000
          );

          </script>

          </body>
          </html>
          '''


          (ROOT / "index.html").write_text(
              html,
              encoding="utf-8",
          )

          PY

          python /tmp/gonkapulse.py

      - name: Commit pulse data
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "GonkaPulse Bot"
          git config user.email "gonkapulse@users.noreply.github.com"

          git add docs/

          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "pulse: ${{ github.run_id }}"

            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                break
              fi

              echo "Push failed; rebasing and retrying..."

              git pull --rebase origin main
              sleep 2

              if [ "$attempt" = "3" ]; then
                echo "Could not push after retries."
                exit 1
              fi
            done
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print deployment
        run: |
          echo "GonkaPulse:"
          echo "${{ steps.deployment.outputs.page_url }}"
