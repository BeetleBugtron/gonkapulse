            font-variant-numeric:tabular-nums;
          }

          th{
            color:var(--muted);
            font-size:11px;
            text-transform:uppercase;
          }

          .note,
          footer{
            color:var(--muted);
            font-size:12px;
          }

          footer{
            margin-top:30px;
          }
          </style>
          </head>

          <body>
          <main>

          <h1>GonkaPulse</h1>

          <div class="subtitle">
            GLM-5.3-Flash via Gonka Router · availability,
            latency, token usage and actual monitoring cost.
          </div>

          <section class="hero">

            <div class="eyebrow">
              Current status
            </div>

            <div
              class="status"
              id="status"
            >
              —
            </div>

            <div class="grid">

              <div class="card">
                <div class="eyebrow">
                  P95 latency · 24h
                </div>
                <div
                  class="value"
                  id="p95"
                >
                  —
                </div>
              </div>

              <div class="card">
                <div class="eyebrow">
                  Success · 24h
                </div>
                <div
                  class="value"
                  id="success"
                >
