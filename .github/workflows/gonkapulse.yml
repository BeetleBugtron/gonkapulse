name: GonkaPulse

on:
  workflow_dispatch:

  schedule:
    - cron: "2-57/5 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gonkapulse
  cancel-in-progress: false

jobs:
  pulse:
    name: Probe Gonka Router
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      GONKAROUTER_API_KEY: ${{ secrets.GONKAROUTER_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Probe Gonka Router and rebuild dashboard
        shell: bash
        run: |
          set -euo pipefail

          # Refresh main because scheduled jobs can queue.
          git fetch origin main
          git reset --hard origin/main

          mkdir -p docs/data/history

          cat > /tmp/gonkapulse.py <<'PY'
          import os
          import json
          import time
          import tempfile
          import subprocess
          from pathlib import Path
          from datetime import datetime, timezone, timedelta


          # ============================================================
          # CONFIG
          # ============================================================

          NAME = "Gonka Router"
          URL = "https://api.gonkarouter.io/v1/chat/completions"
          MODEL = "zai-org/GLM-5.3-Flash"

          API_KEY = os.environ.get("GONKAROUTER_API_KEY", "")

          # User-supplied Gonka Router price:
          # $0.0023 per 1,000,000 tokens.
          PRICE_PER_MILLION_TOKENS = 0.0023

          CONNECT_TIMEOUT = 10
          REQUEST_TIMEOUT = 30

          ROOT = Path("docs")
          DATA = ROOT / "data"
          HISTORY = DATA / "history"

          CURRENT = DATA / "current.json"
          SUMMARY = DATA / "summary.json"
          MEASUREMENTS = DATA / "measurements.json"

          ROOT.mkdir(parents=True, exist_ok=True)
          DATA.mkdir(parents=True, exist_ok=True)
          HISTORY.mkdir(parents=True, exist_ok=True)


          # ============================================================
          # HELPERS
          # ============================================================

          def now():
              return datetime.now(timezone.utc)


          def iso(dt=None):
              return (dt or now()).isoformat().replace("+00:00", "Z")


          def parse_ts(value):
              return datetime.fromisoformat(
                  value.replace("Z", "+00:00")
              )


          def safe_int(value):
              try:
                  return int(value)
              except Exception:
                  return None


          def safe_float(value):
              try:
                  return float(value)
              except Exception:
                  return None


          def percentile(values, fraction):
              if not values:
                  return None

              values = sorted(values)

              i = round(
                  (len(values) - 1) * fraction
              )

              return values[i]


          def pct(n, d):
              return round(n / d * 100, 3) if d else None


          def read_file(path):
              try:
                  return Path(path).read_text(errors="replace")
              except Exception:
                  return ""


          def parse_headers(raw):
              result = {}

              for line in raw.splitlines():
                  if ":" not in line:
                      continue

                  key, value = line.split(":", 1)
                  result[key.strip().lower()] = value.strip()

              return result


          def classify(http, error_code, error_message):
              text = (
                  f"{error_code or ''} "
                  f"{error_message or ''}"
              ).lower()

              if http == 200:
                  return "up"

              if http == 429:
                  return "rate_limited"

              if http in (500, 502, 503, 504):
                  return "down"

              if http in (401, 403):
                  return "auth_error"

              if http is None:
                  return "timeout"

              return "degraded"


          # ============================================================
          # PROBE
          # ============================================================

          def probe():
              timestamp = now()

              record = {
                  "ts": iso(timestamp),
                  "provider": "gonkarouter",
                  "name": NAME,
                  "requested_model": MODEL,
              }

              if not API_KEY:
                  record.update({
                      "status": "missing_secret",
                      "http": None,
                  })
                  return record

              # Tiny heartbeat.
              #
              # The prompt intentionally asks for the smallest useful
              # completion possible so monitoring itself stays cheap.
              payload = {
                  "model": MODEL,
                  "messages": [
                      {
                          "role": "user",
                          "content": "Reply only OK."
                      }
                  ],
                  "max_tokens": 40,
                  "stream": False,
              }

              header_file = tempfile.NamedTemporaryFile(delete=False)
              body_file = tempfile.NamedTemporaryFile(delete=False)

              header_path = header_file.name
              body_path = body_file.name

              header_file.close()
              body_file.close()

              cmd = [
                  "curl",
                  "-sS",

                  "--connect-timeout",
                  str(CONNECT_TIMEOUT),

                  "--max-time",
                  str(REQUEST_TIMEOUT),

                  "-D",
                  header_path,

                  "-o",
                  body_path,

                  "-w",
                  (
                      "%{http_code}\t"
                      "%{time_namelookup}\t"
                      "%{time_connect}\t"
                      "%{time_appconnect}\t"
                      "%{time_starttransfer}\t"
                      "%{time_total}"
                  ),

                  URL,

                  "-H",
                  f"Authorization: Bearer {API_KEY}",

                  "-H",
                  "Content-Type: application/json",

                  "-d",
                  json.dumps(payload),
              ]

              wall_start = time.monotonic()

              try:
                  proc = subprocess.run(
                      cmd,
                      capture_output=True,
                      text=True,
                      timeout=REQUEST_TIMEOUT + 5,
                  )

              except subprocess.TimeoutExpired:
                  return {
                      **record,
                      "status": "timeout",
                      "http": None,
                      "latency_ms": REQUEST_TIMEOUT * 1000,
                      "error_code": "subprocess_timeout",
                  }

              wall_ms = round(
                  (time.monotonic() - wall_start) * 1000
              )

              raw_headers = read_file(header_path)
              raw_body = read_file(body_path)

              try:
                  os.unlink(header_path)
              except Exception:
                  pass

              try:
                  os.unlink(body_path)
              except Exception:
                  pass

              fields = proc.stdout.strip().split("\t")

              http = None
              dns = None
              connect = None
              tls = None
              ttfb = None
              total = None

              if len(fields) >= 6:
                  http = safe_int(fields[0])
                  dns = safe_float(fields[1])
                  connect = safe_float(fields[2])
                  tls = safe_float(fields[3])
                  ttfb = safe_float(fields[4])
                  total = safe_float(fields[5])

              if http == 0:
                  http = None

              try:
                  body = json.loads(raw_body)
              except Exception:
                  body = {}

              actual_model = None
              error_code = None
              error_message = None

              prompt_tokens = None
              completion_tokens = None
              reasoning_tokens = None
              total_tokens = None

              if isinstance(body, dict):
                  actual_model = body.get("model")

                  error = body.get("error")

                  if isinstance(error, dict):
                      error_code = error.get("code")
                      error_message = error.get("message")

                  usage = body.get("usage")

                  if isinstance(usage, dict):
                      prompt_tokens = safe_int(
                          usage.get("prompt_tokens")
                      )

                      completion_tokens = safe_int(
                          usage.get("completion_tokens")
                      )

                      total_tokens = safe_int(
                          usage.get("total_tokens")
                      )

                      details = usage.get(
                          "completion_tokens_details"
                      )

                      if isinstance(details, dict):
                          reasoning_tokens = safe_int(
                              details.get("reasoning_tokens")
                          )

              # Fall back to prompt + completion if total is omitted.
              if (
                  total_tokens is None
                  and prompt_tokens is not None
                  and completion_tokens is not None
              ):
                  total_tokens = (
                      prompt_tokens + completion_tokens
                  )

              cost_usd = None

              if total_tokens is not None:
                  cost_usd = (
                      total_tokens
                      / 1_000_000
                      * PRICE_PER_MILLION_TOKENS
                  )

              headers = parse_headers(raw_headers)

              record.update({
                  "actual_model": actual_model,

                  "http": http,

                  "status": classify(
                      http,
                      error_code,
                      error_message,
                  ),

                  "latency_ms": (
                      round(total * 1000)
                      if total is not None
                      else wall_ms
                  ),

                  "dns_ms": (
                      round(dns * 1000)
                      if dns is not None
                      else None
                  ),

                  "connect_ms": (
                      round(connect * 1000)
                      if connect is not None
                      else None
                  ),

                  "tls_ms": (
                      round(tls * 1000)
                      if tls is not None
                      else None
                  ),

                  "ttfb_ms": (
                      round(ttfb * 1000)
                      if ttfb is not None
                      else None
                  ),

                  "prompt_tokens": prompt_tokens,
                  "completion_tokens": completion_tokens,
                  "reasoning_tokens": reasoning_tokens,
                  "total_tokens": total_tokens,

                  "cost_usd": cost_usd,

                  "retry_after": safe_int(
                      headers.get("retry-after")
                  ),

                  "rate_limit_limit": safe_int(
                      headers.get("x-ratelimit-limit")
                  ),

                  "rate_limit_remaining": safe_int(
                      headers.get("x-ratelimit-remaining")
                  ),

                  "rate_limit_reset": safe_int(
                      headers.get("x-ratelimit-reset")
                  ),

                  "error_code": error_code,
                  "curl_exit": proc.returncode,
              })

              if error_message:
                  record["error_message"] = error_message[:500]

              return record


          # ============================================================
          # SAVE CURRENT PROBE
          # ============================================================

          record = probe()

          print()
          print("=" * 80)
          print("GonkaPulse")
          print("=" * 80)
          print("Time:   ", record.get("ts"))
          print("Status: ", record.get("status"))
          print("HTTP:   ", record.get("http"))
          print("Latency:", record.get("latency_ms"), "ms")
          print("TTFB:   ", record.get("ttfb_ms"), "ms")
          print("Tokens: ", record.get("total_tokens"))
          print("Cost:   ", record.get("cost_usd"))
          print()

          day = now().strftime("%Y/%m/%d")

          history_file = (
              HISTORY
              / f"{day}.jsonl"
          )

          history_file.parent.mkdir(
              parents=True,
              exist_ok=True,
          )

          with history_file.open(
              "a",
              encoding="utf-8",
          ) as f:
              f.write(
                  json.dumps(
                      record,
                      separators=(",", ":"),
                      ensure_ascii=False,
                  )
                  + "\n"
              )


          # ============================================================
          # LOAD ALL HISTORY
          # ============================================================

          rows = []

          for path in HISTORY.rglob("*.jsonl"):

              try:
                  lines = path.read_text(
                      errors="replace"
                  ).splitlines()
              except Exception:
                  continue

              for line in lines:
                  line = line.strip()

                  if not line:
                      continue

                  try:
                      row = json.loads(line)
                      parse_ts(row["ts"])
                  except Exception:
                      continue

                  rows.append(row)

          rows.sort(
              key=lambda r: r.get("ts", "")
          )


          # ============================================================
          # CURRENT
          # ============================================================

          CURRENT.write_text(
              json.dumps(
                  {
                      "project": "GonkaPulse",
                      "generated_at": iso(),
                      "provider": record,
                  },
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )


          # ============================================================
          # STATS
          # ============================================================

          current_time = now()

          cutoff_24h = (
              current_time - timedelta(hours=24)
          )

          cutoff_7d = (
              current_time - timedelta(days=7)
          )

          recent_24h = [
              r for r in rows
              if parse_ts(r["ts"]) >= cutoff_24h
          ]

          recent_7d = [
              r for r in rows
              if parse_ts(r["ts"]) >= cutoff_7d
          ]


          def stats(entries):
              count = len(entries)

              up = [
                  r for r in entries
                  if r.get("status") == "up"
              ]

              rate_limited = [
                  r for r in entries
                  if r.get("status") == "rate_limited"
              ]

              timeouts = [
                  r for r in entries
                  if r.get("status") == "timeout"
              ]

              failures = [
                  r for r in entries
                  if r.get("status") not in (
                      "up",
                      "rate_limited",
                  )
              ]

              latency = [
                  r["latency_ms"]
                  for r in up
                  if isinstance(
                      r.get("latency_ms"),
                      (int, float),
                  )
              ]

              ttfb = [
                  r["ttfb_ms"]
                  for r in up
                  if isinstance(
                      r.get("ttfb_ms"),
                      (int, float),
                  )
              ]

              prompt_tokens = sum(
                  r.get("prompt_tokens") or 0
                  for r in entries
              )

              completion_tokens = sum(
                  r.get("completion_tokens") or 0
                  for r in entries
              )

              reasoning_tokens = sum(
                  r.get("reasoning_tokens") or 0
                  for r in entries
              )

              total_tokens = sum(
                  r.get("total_tokens") or 0
                  for r in entries
              )

              actual_cost = sum(
                  r.get("cost_usd") or 0
                  for r in entries
              )

              return {
                  "checks": count,

                  "successful_checks": len(up),

                  "success_pct": pct(
                      len(up),
                      count,
                  ),

                  "rate_limited_checks":
                      len(rate_limited),

                  "rate_limited_pct": pct(
                      len(rate_limited),
                      count,
                  ),

                  "timeout_checks":
                      len(timeouts),

                  "timeout_pct": pct(
                      len(timeouts),
                      count,
                  ),

                  "failure_checks":
                      len(failures),

                  "p50_latency_ms":
                      percentile(latency, 0.50),

                  "p95_latency_ms":
                      percentile(latency, 0.95),

                  "p99_latency_ms":
                      percentile(latency, 0.99),

                  "p50_ttfb_ms":
                      percentile(ttfb, 0.50),

                  "p95_ttfb_ms":
                      percentile(ttfb, 0.95),

                  "prompt_tokens":
                      prompt_tokens,

                  "completion_tokens":
                      completion_tokens,

                  "reasoning_tokens":
                      reasoning_tokens,

                  "total_tokens":
                      total_tokens,

                  "cost_usd":
                      actual_cost,
              }


          stats_24h = stats(recent_24h)
          stats_7d = stats(recent_7d)
          stats_all = stats(rows)


          # ============================================================
          # COST PROJECTIONS
          # ============================================================

          daily_cost = stats_24h["cost_usd"]

          projected_30d = (
              daily_cost * 30
          )

          daily_tokens = stats_24h["total_tokens"]

          projected_30d_tokens = (
              daily_tokens * 30
          )


          # ============================================================
          # HEAVY AGENT COST MODEL
          # ============================================================

          AGENT_INPUT_TOKENS = 100_000
          AGENT_OUTPUT_TOKENS = 20_000

          AGENT_TOTAL_TOKENS = (
              AGENT_INPUT_TOKENS
              + AGENT_OUTPUT_TOKENS
          )

          AGENT_COST = (
              AGENT_TOTAL_TOKENS
              / 1_000_000
              * PRICE_PER_MILLION_TOKENS
          )


          # ============================================================
          # SUMMARY
          # ============================================================

          summary = {
              "project": "GonkaPulse",

              "generated_at": iso(),

              "provider": {
                  "name": NAME,
                  "model": MODEL,
                  "url": URL,
              },

              "pricing": {
                  "usd_per_million_tokens":
                      PRICE_PER_MILLION_TOKENS,

                  "heavy_agent": {
                      "input_tokens":
                          AGENT_INPUT_TOKENS,

                      "output_tokens":
                          AGENT_OUTPUT_TOKENS,

                      "total_tokens":
                          AGENT_TOTAL_TOKENS,

                      "cost_usd":
                          AGENT_COST,

                      "cost_1k_turns_usd":
                          AGENT_COST * 1000,

                      "cost_10k_turns_usd":
                          AGENT_COST * 10000,

                      "cost_100k_turns_usd":
                          AGENT_COST * 100000,
                  },
              },

              "current": record,

              "last_24h": stats_24h,
              "last_7d": stats_7d,
              "all_time": stats_all,

              "monitoring_cost": {
                  "last_24h_usd":
                      daily_cost,

                  "projected_30d_usd":
                      projected_30d,

                  "last_24h_tokens":
                      daily_tokens,

                  "projected_30d_tokens":
                      projected_30d_tokens,
              },
          }


          SUMMARY.write_text(
              json.dumps(
                  summary,
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )


          # Keep the dashboard payload manageable.
          MEASUREMENTS.write_text(
              json.dumps(
                  {
                      "generated_at": iso(),
                      "measurements": rows[-10000:],
                  },
                  separators=(",", ":"),
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )


          # ============================================================
          # DASHBOARD
          # ============================================================

          html = r'''<!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">

          <title>GonkaPulse</title>

          <style>
          :root{
            color-scheme:dark;
            --bg:#080a0f;
            --card:#111620;
            --card2:#0d1119;
            --border:#252d3b;
            --text:#f5f7fb;
            --muted:#8d99aa;
            --green:#3dde9d;
            --yellow:#f1c75b;
            --red:#ff6678;
            --blue:#72a7ff;
          }

          *{
            box-sizing:border-box;
          }

          body{
            margin:0;
            background:var(--bg);
            color:var(--text);
            font:14px/1.45 Inter,system-ui,sans-serif;
          }

          main{
            width:min(1200px,calc(100% - 28px));
            margin:auto;
            padding:48px 0 80px;
          }

          h1{
            font-size:clamp(42px,7vw,72px);
            letter-spacing:-.055em;
            margin:0;
          }

          .subtitle{
            color:var(--muted);
            font-size:16px;
            margin:8px 0 28px;
          }

          .hero,
          .card{
            border:1px solid var(--border);
            background:var(--card);
            border-radius:16px;
          }

          .hero{
            padding:28px;
            margin-bottom:18px;
          }

          .eyebrow{
            text-transform:uppercase;
            letter-spacing:.12em;
            color:var(--muted);
            font-size:11px;
            font-weight:800;
          }

          .status{
            font-size:clamp(64px,12vw,110px);
            line-height:.95;
            font-weight:900;
            letter-spacing:-.06em;
            margin:12px 0;
          }

          .up{
            color:var(--green);
          }

          .rate_limited,
          .degraded{
            color:var(--yellow);
          }

          .down,
          .timeout,
          .auth_error,
          .missing_secret,
          .error{
            color:var(--red);
          }

          .grid{
            display:grid;
            grid-template-columns:
              repeat(auto-fit,minmax(190px,1fr));
            gap:12px;
            margin:18px 0;
          }

          .card{
            padding:18px;
          }

          .value{
            font-size:30px;
            font-weight:900;
            margin-top:6px;
          }

          .money{
            color:var(--green);
          }

          .section{
            margin-top:28px;
          }

          .section h2{
            font-size:22px;
            margin-bottom:12px;
          }

          .bars{
            display:flex;
            height:36px;
            gap:1px;
            margin-top:12px;
          }

          .bar{
            flex:1;
            min-width:1px;
          }

          .bar.up{
            background:var(--green);
          }

          .bar.rate_limited{
            background:var(--yellow);
          }

          .bar.degraded{
            background:#df9b45;
          }

          .bar.timeout,
          .bar.down,
          .bar.auth_error,
