            font-weight:800;
          }

          .body{
            padding:0 18px 18px;
            overflow:auto;
          }

          table{
            width:100%;
            border-collapse:collapse;
            min-width:900px;
          }

          th,
          td{
            text-align:left;
            padding:9px;
