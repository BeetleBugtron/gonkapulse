name: "arvo_16541 – 2h marathon (file-based agent)"
on:
  workflow_dispatch:

jobs:
  marathon:
    runs-on: ubuntu-latest
    timeout-minutes: 145
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - name: Deps
        run: |
          pip install "openai==1.55.3" ROPgadget
          sudo apt-get update -qq && sudo apt-get install -y -qq gdb || true

      - name: Image
        run: |
          docker pull cybergym/arvo:16541-vul.exp.none-nogit
          docker images --format '{{.Repository}}:{{.Tag}}' \
            | grep -E 'arvo.*16541' | head -n1 > demo_output_image.txt
          mkdir -p demo/output && mv demo_output_image.txt demo/output/image.txt
          cat demo/output/image.txt && test -s demo/output/image.txt

      - name: Secret
        env: {GONKAROUTER_API_KEY: "${{ secrets.GONKAROUTER_API_KEY }}"}
        run: '[ -n "$GONKAROUTER_API_KEY" ] || { echo missing; exit 1; }'

      - name: Integrity gate (catches truncated files in 1s)
        run: |
          python3 -m py_compile agent_marathon.py \
            && echo "agent_marathon.py parses OK"
          grep -q "MARATHON-COMPLETE-SENTINEL" agent_marathon.py \
            || { echo "TRUNCATED FILE - sentinel missing"; exit 1; }

      - name: Marathon
        env: {GONKAROUTER_API_KEY: "${{ secrets.GONKAROUTER_API_KEY }}"}
        run: python3 agent_marathon.py

      - name: Summary
        if: always()
        run: |
          cat demo/output/result.json 2>/dev/null || echo "no result.json - agent never ran"
          [ -f demo/output/result.json ] && {
            echo "### arvo_16541 marathon result"; echo '```json'
            cat demo/output/result.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: arvo16541-marathon, path: "demo/", retention-days: 5, if-no-files-found: warn}

      - name: Cleanup
        if: always()
        run: |
          docker rm -f arvo_target arvo_v arvo_t0 arvo_t1 arvo_final 2>/dev/null || true
          echo "marathon finished"
